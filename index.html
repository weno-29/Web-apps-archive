<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Apps Archive</title>
  <style>
    :root { --bg:#121212; --panel:#1c1b19; --line:#2f2d29; --ink:#ece7df; --ink-2:#b3ab9f; --accent:#f2a33a; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f4f1ea; --panel:#fbf9f5; --line:#ddd6c9; --ink:#1f1b16; --ink-2:#5a5247; --accent:#c9760a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif; line-height:1.7; }
    main { width:min(720px, 100% - 32px); margin:0 auto; padding:56px 0; }
    h1 { font-size:28px; margin:0 0 8px; }
    p { color:var(--ink-2); margin:0 0 24px; }
    ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
    a.card { display:block; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; color:inherit; text-decoration:none; }
    a.card:hover { border-color:var(--accent); }
    a.card b { display:block; font-size:16px; }
    a.card span { color:var(--ink-2); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <h1>Web Apps Archive</h1>
    <p>Weno-29 のウェブアプリ置き場</p>
    <ul>
      <li><a class="card" href="./weno-automix/"><b>Weno AutoMix Engine</b><span>demo音源を参照して、各stemのミックス推奨設定とLogic Pro用メモを生成</span></a></li>
      <li><a class="card" href="./signal-converter/"><b>Signal Converter</b><span>文書・音声・動画・画像・データの拡張子変換。見出し・表・改行を保ったままPDF化。すべてブラウザ内で完結</span></a></li>
      <li><a class="card" href="./eiken-trainer/"><b>英検準1級・1級 合格トレーナー</b><span>試験ガイド・単語カード・語彙クイズ・ライティング語数カウンター・二次試験対策（オフライン対応）</span></a></li>
    </ul>
  </main>
</body>
</html>
